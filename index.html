<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ti · брови</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#f0e6e2;
  --mute:#a89892;
  --rose:#d49a9f;
  --rose2:#b36f75;
  --line:rgba(180,120,130,.4);
  --card:rgba(255,248,246,.55);
}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--ink);
  background:#2a2220;
  padding:0 0 calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 100% 55% at 50% -20%,rgba(120,60,80,.45),transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 40%,rgba(90,50,120,.28),transparent 50%),
    radial-gradient(ellipse 40% 30% at 0% 80%,rgba(40,80,100,.2),transparent 50%),
    linear-gradient(180deg,#2a2220 0%,#1e1816 55%,#161210 100%);
}
.wrap{position:relative;z-index:1;max-width:400px;margin:0 auto;padding:28px 16px 16px}

/* hero */
.hero{text-align:center;margin-bottom:20px}
.logo-wrap{position:relative;width:92px;height:92px;margin:0 auto 14px;filter:drop-shadow(0 14px 24px rgba(201,137,142,.35))}
.logo{
  width:92px;height:92px;border-radius:50%;
  background:linear-gradient(145deg,#fff 0%,#f5d5d8 42%,#e8b4b8 100%);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.85),inset 0 -8px 16px rgba(201,137,142,.2);
}
.logo span{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;color:#fff;text-shadow:0 2px 8px rgba(150,90,95,.28);letter-spacing:.06em}
.logo-ring{position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(232,180,184,.4)}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;letter-spacing:.16em}
.hero .line{width:42px;height:1.5px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--rose2),transparent)}
.hero p{font-size:13px;color:var(--mute);letter-spacing:.08em}

/* sections */
.section{margin-bottom:14px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:4px 4px 10px;
}
.section-head h2{
  font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.04em;
}
.section-head span{font-size:11px;color:var(--mute);letter-spacing:.04em}

.card{
  background:rgba(40,32,30,.72);
  border-radius:22px;
  padding:18px 16px;
  border:1px solid rgba(212,154,159,.22);
  box-shadow:0 12px 32px rgba(0,0,0,.35),0 0 24px rgba(155,123,255,.06),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(12px);
}

/* gallery */
.g-tabs{display:flex;gap:8px;margin-bottom:12px}
.g-tab{
  flex:1;padding:9px 0;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.55);font-size:12px;font-weight:600;font-family:inherit;
  color:var(--mute);cursor:pointer;
}
.g-tab.active{background:linear-gradient(135deg,#f0c8cb,#e8b4b8);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(201,137,142,.25)}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g-item{
  position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;
  background:linear-gradient(145deg,#f7efec,#efe4e0);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 6px 16px rgba(47,40,38,.06);
}
.g-item img{width:100%;height:100%;object-fit:cover;display:block}
.g-tag{
  position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:600;letter-spacing:.04em;
  background:rgba(44,36,34,.55);color:#fff;padding:4px 9px;border-radius:999px;backdrop-filter:blur(8px);
}
.g-empty{grid-column:1/-1;text-align:center;color:var(--mute);font-size:13px;padding:28px 10px}

/* reviews */
.rev-list{display:flex;flex-direction:column;gap:10px}
.rev-card{
  padding:14px;border-radius:16px;background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.85);
}
.rev-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rev-name{font-weight:650;font-size:13px}
.rev-stars{color:#c9898e;font-size:12px;letter-spacing:1px}
.rev-text{font-size:13px;color:var(--ink);line-height:1.45;opacity:.9}
.rev-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rev-form label{display:block;font-size:10px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 6px}
.rev-form label:first-child{margin-top:0}
.stars-pick{display:flex;gap:6px}
.stars-pick button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:16px;cursor:pointer;opacity:.45;
}
.stars-pick button.on{opacity:1;background:rgba(232,180,184,.25);border-color:var(--rose2)}

input,textarea,select{
  width:100%;padding:13px 14px;border-radius:14px;
  border:1px solid rgba(180,120,130,.35);background:rgba(30,24,22,.75);
  font-family:inherit;font-size:15px;color:var(--ink);outline:none;
  -webkit-appearance:none;
}
input:focus,textarea:focus{border-color:var(--rose2);background:rgba(40,32,30,.95);box-shadow:0 0 0 3px rgba(155,123,255,.15)}
textarea{min-height:72px;resize:none}
label.field{display:block;font-size:10px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 6px}
label.field:first-of-type{margin-top:0}

/* services */
.services{display:flex;flex-direction:column;gap:8px}
.svc{
  display:flex;align-items:center;gap:12px;padding:13px 12px;width:100%;
  border-radius:16px;border:1px solid rgba(232,180,184,.28);
  background:rgba(30,24,22,.55);text-align:left;font-family:inherit;color:inherit;cursor:pointer;
}
.svc.active{border-color:rgba(201,137,142,.55);background:linear-gradient(135deg,rgba(255,245,246,.95),#fff);box-shadow:0 4px 14px rgba(201,137,142,.12)}
.svc .dot{width:12px;height:12px;border-radius:50%;border:2px solid #e0d4cf;flex-shrink:0;background:#fff}
.svc.active .dot{background:linear-gradient(145deg,#f0c8cb,var(--rose2));border-color:var(--rose2)}
.svc strong{display:block;font-size:13px;font-weight:650}
.svc em{display:block;font-size:11px;font-style:normal;color:var(--mute);margin-top:2px}
.svc .price{margin-left:auto;font-size:13px;font-weight:700;color:var(--rose2);white-space:nowrap}

.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{
  padding:10px 14px;border-radius:999px;border:1px solid rgba(232,180,184,.3);
  background:rgba(30,24,22,.7);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--ink);
}
.slot.active{background:linear-gradient(135deg,#f0c8cb,#c9898e);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(201,137,142,.3)}

.btn{
  width:100%;margin-top:16px;padding:16px;border:none;border-radius:999px;
  background:linear-gradient(145deg,#f0c8cb 0%,#e8b4b8 40%,#c9898e 100%);
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;letter-spacing:.04em;cursor:pointer;
  box-shadow:0 10px 24px rgba(201,137,142,.35);
}
.btn:active{transform:scale(.98)}
.btn-soft{
  width:100%;margin-top:10px;padding:12px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.7);
  color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
}

.foot{text-align:center;margin-top:18px;font-size:11px;color:#6a5e5a;letter-spacing:.1em}
.admin-link{display:block;text-align:center;margin:12px 0 18px;font-size:12px;color:var(--mute);text-decoration:none;letter-spacing:.04em}
.admin{display:none;margin-top:10px}
.admin.show{display:block}
.book-item{padding:12px;border-radius:14px;background:rgba(255,255,255,.55);margin-bottom:8px;font-size:13px;border:1px solid rgba(255,255,255,.8)}
.book-item strong{display:block;margin-bottom:3px}
.book-item span{color:var(--mute);font-size:12px}

.overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,8,8,.65);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex}
.popup{
  background:linear-gradient(165deg,#fff,#fff8f7);border-radius:24px;padding:28px 22px;text-align:center;
  max-width:320px;width:100%;box-shadow:0 20px 50px rgba(44,36,34,.18);border:1px solid #fff;
}
.popup .check{
  width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
  background:linear-gradient(145deg,#f5d0d3,#c9898e);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 10px 24px rgba(201,137,142,.35);
}
.popup h3{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px}
.popup p{font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:18px}
.popup button{padding:12px 28px;border-radius:999px;border:none;background:rgba(232,180,184,.25);color:var(--ink);font-weight:650;font-family:inherit;cursor:pointer}

/* cyber lean ambient */
.cyber-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cyber-bg .grid{
  position:absolute;inset:0;opacity:.14;
  background-image:
    linear-gradient(rgba(201,137,142,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(155,123,255,.2) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,#000 20%,transparent 75%);
}
.cyber-bg .orb{
  position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;
  animation:orb-float 12s ease-in-out infinite;
}
.cyber-bg .o1{width:180px;height:180px;left:-40px;top:12%;background:rgba(155,123,255,.55)}
.cyber-bg .o2{width:220px;height:220px;right:-50px;top:40%;background:rgba(232,120,160,.4);animation-delay:-4s}
.cyber-bg .o3{width:140px;height:140px;left:30%;bottom:8%;background:rgba(92,225,230,.35);animation-delay:-7s}
@keyframes orb-float{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-18px) scale(1.06)}
}

100%{top:102%}}
.card{position:relative}
.card.glow-edge{box-shadow:0 12px 32px rgba(0,0,0,.35),0 0 0 1px rgba(155,123,255,.18),0 0 28px rgba(212,154,159,.08),inset 0 1px 0 rgba(255,255,255,.06)}

</style>
</head>
<body>
<div class="cyber-bg" aria-hidden="true">
  <div class="grid"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>
<div class="wrap">
  <header class="hero">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo"><span>Ti</span></div>
    </div>
    <h1>Ti</h1>
    <div class="line"></div>
    <p>брови · запись online</p>
  </header>

  <!-- BOOKING -->
  <section class="section">
    <div class="section-head">
      <h2>Запись</h2>
      <span>online</span>
    </div>
    <div class="card glow-edge" style="margin-bottom:12px">
      <label class="field">Услуга</label>
      <div class="services" id="services">
        <button type="button" class="svc active" data-svc="Коррекция бровей" data-price="1500">
          <span class="dot"></span>
          <div><strong>Коррекция бровей</strong><em>форма и окрашивание</em></div>
          <span class="price">1 500 ₽</span>
        </button>
        <button type="button" class="svc" data-svc="Архитектура бровей" data-price="2000">
          <span class="dot"></span>
          <div><strong>Архитектура бровей</strong><em>подбор формы с нуля</em></div>
          <span class="price">2 000 ₽</span>
        </button>
        <button type="button" class="svc" data-svc="Ламинирование" data-price="2500">
          <span class="dot"></span>
          <div><strong>Ламинирование</strong><em>долговременный уход</em></div>
          <span class="price">2 500 ₽</span>
        </button>
        <button type="button" class="svc" data-svc="Консультация" data-price="0">
          <span class="dot"></span>
          <div><strong>Консультация</strong><em>online · 15 минут</em></div>
          <span class="price">бесплатно</span>
        </button>
      </div>
    </div>

    <div class="card glow-edge" style="margin-bottom:12px">
      <label class="field" for="date">День</label>
      <input type="date" id="date" required>
      <label class="field">Время</label>
      <div class="slots" id="slots">
        <button type="button" class="slot" data-t="10:00">10:00</button>
        <button type="button" class="slot" data-t="11:30">11:30</button>
        <button type="button" class="slot" data-t="13:00">13:00</button>
        <button type="button" class="slot" data-t="15:00">15:00</button>
        <button type="button" class="slot" data-t="17:00">17:00</button>
        <button type="button" class="slot" data-t="19:00">19:00</button>
      </div>
    </div>

    <div class="card glow-edge">
      <label class="field" for="name">Имя</label>
      <input type="text" id="name" placeholder="Как к вам обращаться" maxlength="60" autocomplete="name">
      <label class="field" for="phone">Телефон</label>
      <input type="tel" id="phone" placeholder="+7" maxlength="20" autocomplete="tel">
      <label class="field" for="note">Комментарий</label>
      <textarea id="note" placeholder="Пожелания к записи" maxlength="200"></textarea>
      <button type="button" class="btn" id="submit">Записаться</button>
    </div>
  </section>

<a href="#" class="admin-link" id="admin-toggle">мои записи на этом устройстве</a>
  <div class="admin" id="admin">
    <div class="card">
      <div id="book-list"><p style="color:var(--mute);font-size:13px">Пока пусто</p></div>
    </div>
  </div>

    <!-- WORKS -->
  <section class="section">
    <div class="section-head">
      <h2>Работы</h2>
      <span>до и после</span>
    </div>
    <div class="card glow-edge">
      <div class="g-tabs">
        <button type="button" class="g-tab active" data-kind="all">Все</button>
        <button type="button" class="g-tab" data-kind="before">До</button>
        <button type="button" class="g-tab" data-kind="after">После</button>
      </div>
      <div class="g-grid" id="gallery-grid">
        <p class="g-empty">Пока нет фото — скоро появятся работы Ti</p>
      </div>
    </div>
  </section>

    <!-- REVIEWS -->
  <section class="section">
    <div class="section-head">
      <h2>Отзывы</h2>
      <span>клиенты</span>
    </div>
    <div class="card">
      <div class="rev-list" id="rev-list">
        <p class="g-empty" style="padding:12px 0">Пока нет отзывов — будьте первой</p>
      </div>
      <div class="rev-form">
        <label>Оценка</label>
        <div class="stars-pick" id="stars">
          <button type="button" data-r="1">★</button>
          <button type="button" data-r="2">★</button>
          <button type="button" data-r="3">★</button>
          <button type="button" data-r="4">★</button>
          <button type="button" data-r="5" class="on">★</button>
        </div>
        <label for="rev-name">Имя</label>
        <input type="text" id="rev-name" maxlength="40" placeholder="Как вас представить">
        <label for="rev-text">Отзыв</label>
        <textarea id="rev-text" maxlength="400" placeholder="Как прошла процедура"></textarea>
        <button type="button" class="btn-soft" id="rev-send">Отправить на модерацию</button>
      </div>
    </div>
  </section>

  <p class="foot">Ti · beauty</p>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="check">✓</div>
    <h3>Заявка отправлена</h3>
    <p id="ok-text">Ожидайте подтверждения от Ti — бот напишет вам в Telegram.</p>
    <button type="button" id="ok-close">Хорошо</button>
  </div>
</div>

<script>
/* ===== URL скрипта ===== */
var TI_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxx2QvTOfchyy7B9FYq5rCc4GGSME8wX6wNAg1dl7XeMZ_N8WQ2AUUOfUxotF5aGSf-9g/exec';
/* ====================== */

if (window.Telegram && Telegram.WebApp) {
  try {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    try { Telegram.WebApp.setHeaderColor('#2a2220'); Telegram.WebApp.setBackgroundColor('#2a2220'); } catch (e) {}
  } catch (e) {}
}

var svc = 'Коррекция бровей', price = 1500, time = '', rating = 5, galleryKind = 'all';
var KEY = 'ti_bookings_v1';

function storage() {
  try { localStorage.setItem('_', '1'); localStorage.removeItem('_'); return localStorage; }
  catch (e) { return { d: {}, getItem: function (k) { return this.d[k] || null; }, setItem: function (k, v) { this.d[k] = String(v); } }; }
}
var store = storage();

(function () {
  var d = new Date(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  var el = document.getElementById('date');
  el.min = d.getFullYear() + '-' + m + '-' + day;
  el.value = el.min;
})();

document.getElementById('services').addEventListener('click', function (e) {
  var b = e.target.closest('.svc'); if (!b) return;
  document.querySelectorAll('.svc').forEach(function (x) { x.classList.remove('active'); });
  b.classList.add('active');
  svc = b.getAttribute('data-svc');
  price = +b.getAttribute('data-price') || 0;
});
document.getElementById('slots').addEventListener('click', function (e) {
  var b = e.target.closest('.slot'); if (!b) return;
  document.querySelectorAll('.slot').forEach(function (x) { x.classList.remove('active'); });
  b.classList.add('active');
  time = b.getAttribute('data-t');
});

document.getElementById('stars').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  rating = +b.getAttribute('data-r') || 5;
  document.querySelectorAll('#stars button').forEach(function (x) {
    x.classList.toggle('on', +x.getAttribute('data-r') <= rating);
  });
});

function postAction(payload, cb) {
  if (!TI_SCRIPT_URL) { if (cb) cb(false); return; }
  var body = JSON.stringify(payload);
  try {
    fetch(TI_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
      redirect: 'follow'
    }).then(function () { if (cb) cb(true); }).catch(function () {
      try { fetch(TI_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body }); } catch (e) {}
      if (cb) cb(true);
    });
  } catch (e) {
    try { fetch(TI_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body }); } catch (e2) {}
    if (cb) cb(false);
  }
}

function loadGallery() {
  var grid = document.getElementById('gallery-grid');
  if (!grid) return;
  if (!TI_SCRIPT_URL) {
    grid.innerHTML = '<p class="g-empty">Галерея скоро</p>';
    return;
  }
  fetch(TI_SCRIPT_URL + '?action=gallery')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var items = (data && data.items) || [];
      if (galleryKind !== 'all') items = items.filter(function (x) { return x.kind === galleryKind; });
      if (!items.length) {
        grid.innerHTML = '<p class="g-empty">Пока нет фото — скоро появятся работы Ti</p>';
        return;
      }
      grid.innerHTML = items.slice(0, 12).map(function (it) {
        var tag = it.kind === 'before' ? 'до' : (it.kind === 'after' ? 'после' : 'работа');
        return '<div class="g-item"><span class="g-tag">' + tag + '</span><img alt="" data-fid="' + it.file_id + '"/></div>';
      }).join('');
      Array.prototype.forEach.call(grid.querySelectorAll('img[data-fid]'), function (img) {
        fetch(TI_SCRIPT_URL + '?action=photo&file_id=' + encodeURIComponent(img.getAttribute('data-fid')))
          .then(function (r) { return r.text(); })
          .then(function (b64) {
            if (b64 && b64.length > 100 && b64.indexOf('<') !== 0) img.src = 'data:image/jpeg;base64,' + b64;
          }).catch(function () {});
      });
    })
    .catch(function () {
      grid.innerHTML = '<p class="g-empty">Пока нет фото — скоро появятся работы Ti</p>';
    });
}

document.querySelectorAll('.g-tab').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.g-tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    galleryKind = btn.getAttribute('data-kind');
    loadGallery();
  });
});

function starsStr(n) {
  n = Math.max(1, Math.min(5, n || 5));
  return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
}

function loadReviews() {
  var box = document.getElementById('rev-list');
  if (!box || !TI_SCRIPT_URL) return;
  fetch(TI_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'list_reviews' })
  }).then(function (r) { return r.json(); }).then(function (data) {
    var list = (data && data.reviews) || [];
    if (!list.length) {
      box.innerHTML = '<p class="g-empty" style="padding:12px 0">Пока нет отзывов — будьте первой</p>';
      return;
    }
    box.innerHTML = list.slice().reverse().slice(0, 20).map(function (r) {
      return '<div class="rev-card"><div class="rev-top"><span class="rev-name">' +
        (r.name || 'Клиент') + '</span><span class="rev-stars">' + starsStr(r.rating) +
        '</span></div><div class="rev-text">' + (r.text || '') + '</div></div>';
    }).join('');
  }).catch(function () {});
}

document.getElementById('rev-send').onclick = function () {
  var name = (document.getElementById('rev-name').value || '').trim();
  var text = (document.getElementById('rev-text').value || '').trim();
  if (!text) { alert('Напишите отзыв'); return; }
  postAction({ action: 'review', name: name || 'Клиент', text: text, rating: rating }, function () {
    document.getElementById('rev-text').value = '';
    alert('Отзыв отправлен на модерацию Ti');
  });
};

function loadList() {
  var list = [];
  try { list = JSON.parse(store.getItem(KEY) || '[]'); } catch (e) {}
  var box = document.getElementById('book-list');
  if (!list.length) {
    box.innerHTML = '<p style="color:var(--mute);font-size:13px">Пока пусто</p>';
    return;
  }
  box.innerHTML = list.slice().reverse().map(function (b) {
    return '<div class="book-item"><strong>' + b.name + ' · ' + b.svc + '</strong><span>' +
      b.date + ' в ' + b.time + ' · ' + b.phone + (b.note ? ' · ' + b.note : '') + '</span></div>';
  }).join('');
}

document.getElementById('submit').onclick = function () {
  var name = (document.getElementById('name').value || '').trim();
  var phone = (document.getElementById('phone').value || '').trim();
  var note = (document.getElementById('note').value || '').trim();
  var date = document.getElementById('date').value;
  if (!date) { alert('Выберите день'); return; }
  if (!time) { alert('Выберите время'); return; }
  if (!name) { alert('Укажите имя'); return; }
  if (!phone) { alert('Укажите телефон'); return; }

  var row = { id: Date.now(), svc: svc, price: price, date: date, time: time, name: name, phone: phone, note: note, at: new Date().toISOString() };
  var list = [];
  try { list = JSON.parse(store.getItem(KEY) || '[]'); } catch (e) {}
  list.push(row);
  try { store.setItem(KEY, JSON.stringify(list)); } catch (e) {}

  document.getElementById('ok-text').textContent =
    name + ', заявка на «' + svc + '» · ' + date + ' в ' + time +
    ' отправлена. Ti подтвердит запись — бот напишет вам в Telegram.';
  document.getElementById('overlay').classList.add('show');
  loadList();
  try {
    if (Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback)
      Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  } catch (e) {}

  var tgUser = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) || {};
  postAction({
    action: 'book',
    name: name,
    phone: phone,
    note: note,
    svc: svc,
    price: price,
    date: date,
    time: time,
    at: row.at,
    userId: tgUser.id || '',
    username: tgUser.username || ''
  });
};

document.getElementById('ok-close').onclick = function () {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('name').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('note').value = '';
};
document.getElementById('admin-toggle').onclick = function (e) {
  e.preventDefault();
  document.getElementById('admin').classList.toggle('show');
  loadList();
};

loadGallery();
loadReviews();
loadList();
</script>
</body>
</html>
