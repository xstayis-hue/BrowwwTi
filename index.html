<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ti · запись на брови</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2f2826;
  --mute:#8f817c;
  --rose:#e5a8ae;
  --rose2:#c47d84;
  --cream:#fff9f7;
  --sand:#f3e8e4;
}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--ink);
  background:#efe6e2;
  padding:0 0 calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
/* volumetric backdrop */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 50% -15%,rgba(255,220,224,.9),transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 30%,rgba(229,168,174,.25),transparent 50%),
    radial-gradient(ellipse 45% 35% at 0% 70%,rgba(255,240,235,.5),transparent 50%),
    linear-gradient(165deg,#f7efec 0%,#ebe0db 45%,#e5d8d3 100%);
}
.florals{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.florals svg{position:absolute;filter:drop-shadow(0 8px 16px rgba(196,125,132,.15))}
.florals .f1{width:160px;height:160px;top:-28px;right:-36px;opacity:.32}
.florals .f2{width:110px;height:110px;bottom:10%;left:-28px;opacity:.2;transform:rotate(-20deg)}
.florals .f3{width:72px;height:72px;top:42%;right:4px;opacity:.16;transform:rotate(18deg)}

.wrap{position:relative;z-index:1;max-width:400px;margin:0 auto;padding:32px 18px 12px}

/* HERO — floating glass */
.hero{text-align:center;margin-bottom:22px}
.logo-wrap{
  position:relative;width:100px;height:100px;margin:0 auto 18px;
  filter:drop-shadow(0 16px 28px rgba(196,125,132,.35));
}
.logo{
  width:100px;height:100px;border-radius:50%;
  background:
    linear-gradient(145deg,rgba(255,255,255,.95) 0%,rgba(245,220,222,.5) 40%,#e5a8ae 100%);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.85);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.8),
    inset 0 -6px 14px rgba(196,125,132,.25),
    0 4px 0 rgba(196,125,132,.12);
  position:relative;
}
.logo::before{
  content:'';position:absolute;inset:8px;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);pointer-events:none;
}
.logo span{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:40px;font-weight:600;color:#fff;
  text-shadow:0 2px 8px rgba(150,90,95,.3);letter-spacing:.06em;
  position:relative;z-index:1;
}
.logo-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(229,168,174,.4);
  box-shadow:0 0 0 4px rgba(255,255,255,.15);
}
.bloom{
  position:absolute;width:20px;height:20px;border-radius:50% 0 50% 50%;
  background:linear-gradient(135deg,#fff,#e5a8ae);
  box-shadow:0 4px 10px rgba(196,125,132,.3);
}
.bloom.b1{top:0;right:-2px;transform:rotate(-25deg)}
.bloom.b2{bottom:8px;left:-4px;width:14px;height:14px;transform:rotate(50deg);opacity:.85}

.hero h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:36px;font-weight:600;letter-spacing:.18em;
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.hero .line{
  width:48px;height:2px;margin:12px auto;
  background:linear-gradient(90deg,transparent,var(--rose2),transparent);
  border-radius:2px;
  box-shadow:0 1px 2px rgba(196,125,132,.3);
}
.hero p{font-size:13px;color:var(--mute);letter-spacing:.08em;font-weight:500}
.petal-line{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:10px;color:var(--rose2);opacity:.5;font-size:11px;letter-spacing:.25em;
}

/* VOLUME CARDS */
.card{
  position:relative;
  background:linear-gradient(165deg,rgba(255,255,255,.97) 0%,rgba(255,250,248,.92) 100%);
  border-radius:24px;
  padding:22px 18px 20px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.95);
  box-shadow:
    0 2px 4px rgba(47,40,38,.03),
    0 12px 32px rgba(47,40,38,.07),
    0 24px 48px rgba(196,125,132,.08),
    inset 0 1px 0 rgba(255,255,255,1);
  backdrop-filter:blur(12px);
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:-30px;right:-20px;width:90px;height:90px;
  background:radial-gradient(circle,rgba(229,168,174,.2),transparent 70%);
  pointer-events:none;
}
.card::after{
  content:'❀';position:absolute;bottom:10px;right:14px;
  font-size:15px;color:rgba(196,125,132,.15);pointer-events:none;
}
.card h2{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:20px;font-weight:600;letter-spacing:.04em;
  color:var(--ink);margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
}
.card h2::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(229,168,174,.45),transparent);
}

/* services — raised chips */
.services{display:flex;flex-direction:column;gap:11px}
.svc{
  display:flex;align-items:center;gap:14px;padding:15px 14px;
  border-radius:18px;
  background:linear-gradient(180deg,#fff 0%,#faf6f4 100%);
  border:1px solid rgba(239,230,226,.9);
  box-shadow:
    0 2px 6px rgba(47,40,38,.04),
    0 6px 16px rgba(47,40,38,.04),
    inset 0 1px 0 #fff;
  cursor:pointer;text-align:left;width:100%;
  font-family:inherit;color:inherit;
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.svc:active{transform:scale(.985)}
.svc.active{
  border-color:rgba(229,168,174,.65);
  background:linear-gradient(145deg,#fff8f9 0%,#fff 60%);
  box-shadow:
    0 4px 12px rgba(196,125,132,.18),
    0 8px 24px rgba(196,125,132,.1),
    inset 0 1px 0 #fff,
    0 0 0 3px rgba(229,168,174,.15);
}
.svc .dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  background:#fff;
  border:2px solid #e0d4cf;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.svc.active .dot{
  background:linear-gradient(145deg,#f0c4c8,var(--rose2));
  border-color:var(--rose2);
  box-shadow:0 2px 8px rgba(196,125,132,.4),inset 0 1px 0 rgba(255,255,255,.5);
}
.svc strong{display:block;font-size:14px;font-weight:650;letter-spacing:.01em}
.svc em{display:block;font-size:12px;font-style:normal;color:var(--mute);margin-top:3px}
.svc .price{
  margin-left:auto;font-size:13px;font-weight:700;
  color:var(--rose2);white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}

label{
  display:block;font-size:10px;font-weight:600;color:var(--mute);
  letter-spacing:.1em;text-transform:uppercase;margin:14px 0 8px;
}
label:first-of-type{margin-top:0}
input,textarea{
  width:100%;padding:14px 16px;border-radius:16px;
  border:1px solid rgba(239,230,226,.95);
  background:linear-gradient(180deg,#fffcfb,#f7f1ef);
  font-family:inherit;font-size:15px;color:var(--ink);outline:none;
  box-shadow:inset 0 2px 6px rgba(47,40,38,.04),0 1px 0 rgba(255,255,255,.8);
  transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;
}
input:focus,textarea:focus{
  border-color:rgba(229,168,174,.7);
  background:#fff;
  box-shadow:0 0 0 4px rgba(229,168,174,.18),inset 0 1px 2px rgba(47,40,38,.03);
}
textarea{min-height:80px;resize:none}
input::placeholder,textarea::placeholder{color:#c5b6b0}

.slots{display:flex;flex-wrap:wrap;gap:9px}
.slot{
  padding:12px 17px;border-radius:100px;
  border:1px solid rgba(239,230,226,.95);
  background:linear-gradient(180deg,#fff,#faf6f4);
  font-size:13px;font-weight:600;font-family:inherit;color:var(--ink);
  cursor:pointer;
  box-shadow:0 2px 8px rgba(47,40,38,.05),inset 0 1px 0 #fff;
  transition:all .15s;
}
.slot.active{
  border-color:transparent;
  background:linear-gradient(145deg,#f0c4c8 0%,#c47d84 100%);
  color:#fff;
  box-shadow:
    0 6px 18px rgba(196,125,132,.4),
    inset 0 1px 0 rgba(255,255,255,.35),
    0 2px 0 rgba(150,90,95,.15);
}

.btn{
  width:100%;margin-top:20px;padding:17px;
  border:none;border-radius:100px;
  background:linear-gradient(145deg,#f0c4c8 0%,#e5a8ae 40%,#c47d84 100%);
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;
  letter-spacing:.06em;cursor:pointer;
  box-shadow:
    0 8px 24px rgba(196,125,132,.4),
    0 2px 0 rgba(150,90,95,.2),
    inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .12s,box-shadow .12s;
}
.btn:active{
  transform:translateY(1px) scale(.985);
  box-shadow:0 4px 14px rgba(196,125,132,.35),inset 0 1px 0 rgba(255,255,255,.3);
}

.admin-link{
  display:block;text-align:center;margin-top:18px;
  font-size:12px;color:var(--mute);text-decoration:none;letter-spacing:.06em;
}
.admin{display:none;margin-top:12px}
.admin.show{display:block}
.book-item{
  padding:14px 16px;border-radius:16px;margin-bottom:10px;
  background:linear-gradient(180deg,#fff,#faf6f4);
  border:1px solid rgba(239,230,226,.9);
  box-shadow:0 4px 12px rgba(47,40,38,.04);
  font-size:13px;
}
.book-item strong{display:block;margin-bottom:4px;font-weight:650}
.book-item span{color:var(--mute);font-size:12px;line-height:1.45}

.foot{
  text-align:center;margin-top:26px;
  font-size:11px;color:#c4b6b0;letter-spacing:.12em;
}

.overlay{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(47,40,38,.4);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;padding:24px;
}
.overlay.show{display:flex}
.popup{
  background:linear-gradient(165deg,#fff 0%,#fff8f7 100%);
  border-radius:28px;padding:36px 26px;text-align:center;
  max-width:320px;width:100%;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 24px 60px rgba(47,40,38,.18),
    0 8px 20px rgba(196,125,132,.12),
    inset 0 1px 0 #fff;
}
.popup .check{
  width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
  background:linear-gradient(145deg,#f5d0d3,#c47d84);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:28px;
  box-shadow:
    0 12px 28px rgba(196,125,132,.4),
    inset 0 2px 0 rgba(255,255,255,.4);
}
.popup h3{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:26px;font-weight:600;margin-bottom:10px;
}
.popup p{font-size:13px;color:var(--mute);line-height:1.55;margin-bottom:22px}
.popup button{
  padding:13px 36px;border-radius:100px;border:none;
  background:linear-gradient(180deg,#fff,#f5e8e6);
  color:var(--ink);font-family:inherit;font-weight:650;font-size:14px;
  cursor:pointer;box-shadow:0 4px 14px rgba(47,40,38,.08),inset 0 1px 0 #fff;
}
</style>
</head>
<body>
<div class="florals" aria-hidden="true">
  <svg class="f1" viewBox="0 0 120 120" fill="none">
    <g fill="#e5a8ae">
      <ellipse cx="60" cy="40" rx="15" ry="30" transform="rotate(0 60 60)"/>
      <ellipse cx="60" cy="40" rx="15" ry="30" transform="rotate(60 60 60)"/>
      <ellipse cx="60" cy="40" rx="15" ry="30" transform="rotate(120 60 60)"/>
      <ellipse cx="60" cy="40" rx="15" ry="30" transform="rotate(180 60 60)"/>
      <ellipse cx="60" cy="40" rx="15" ry="30" transform="rotate(240 60 60)"/>
      <ellipse cx="60" cy="40" rx="15" ry="30" transform="rotate(300 60 60)"/>
      <circle cx="60" cy="60" r="12" fill="#fff5f4"/>
      <circle cx="60" cy="60" r="6" fill="#c47d84" opacity=".75"/>
    </g>
  </svg>
  <svg class="f2" viewBox="0 0 120 120" fill="none">
    <g fill="#d4b8b0">
      <ellipse cx="60" cy="38" rx="13" ry="28" transform="rotate(30 60 60)"/>
      <ellipse cx="60" cy="38" rx="13" ry="28" transform="rotate(90 60 60)"/>
      <ellipse cx="60" cy="38" rx="13" ry="28" transform="rotate(150 60 60)"/>
      <ellipse cx="60" cy="38" rx="13" ry="28" transform="rotate(210 60 60)"/>
      <ellipse cx="60" cy="38" rx="13" ry="28" transform="rotate(270 60 60)"/>
      <ellipse cx="60" cy="38" rx="13" ry="28" transform="rotate(330 60 60)"/>
      <circle cx="60" cy="60" r="10" fill="#faf6f4"/>
    </g>
  </svg>
  <svg class="f3" viewBox="0 0 120 120" fill="none">
    <g fill="#e5a8ae">
      <ellipse cx="60" cy="42" rx="12" ry="24" transform="rotate(0 60 60)"/>
      <ellipse cx="60" cy="42" rx="12" ry="24" transform="rotate(72 60 60)"/>
      <ellipse cx="60" cy="42" rx="12" ry="24" transform="rotate(144 60 60)"/>
      <ellipse cx="60" cy="42" rx="12" ry="24" transform="rotate(216 60 60)"/>
      <ellipse cx="60" cy="42" rx="12" ry="24" transform="rotate(288 60 60)"/>
      <circle cx="60" cy="60" r="9" fill="#fff5f4"/>
    </g>
  </svg>
</div>

<div class="wrap">
  <header class="hero">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <span class="bloom b1"></span>
      <span class="bloom b2"></span>
      <div class="logo"><span>Ti</span></div>
    </div>
    <h1>Ti</h1>
    <div class="line"></div>
    <p>брови · запись online</p>
    <div class="petal-line"><span>✿</span><span>···</span><span>✿</span></div>
  </header>

  <section class="card">
    <h2>Услуга</h2>
    <div class="services" id="services">
      <button type="button" class="svc active" data-svc="Коррекция бровей" data-price="1500">
        <span class="dot"></span>
        <div><strong>Коррекция бровей</strong><em>форма и окрашивание</em></div>
        <span class="price">1 500 ₽</span>
      </button>
      <button type="button" class="svc" data-svc="Архитектура бровей" data-price="2000">
        <span class="dot"></span>
        <div><strong>Архитектура бровей</strong><em>подбор формы с нуля</em></div>
        <span class="price">2 000 ₽</span>
      </button>
      <button type="button" class="svc" data-svc="Ламинирование" data-price="2500">
        <span class="dot"></span>
        <div><strong>Ламинирование</strong><em>долговременный уход</em></div>
        <span class="price">2 500 ₽</span>
      </button>
      <button type="button" class="svc" data-svc="Консультация" data-price="0">
        <span class="dot"></span>
        <div><strong>Консультация</strong><em>online · 15 минут</em></div>
        <span class="price">бесплатно</span>
      </button>
    </div>
  </section>

  <section class="card">
    <h2>Когда</h2>
    <label for="date">День</label>
    <input type="date" id="date" required>
    <label>Время</label>
    <div class="slots" id="slots">
      <button type="button" class="slot" data-t="10:00">10:00</button>
      <button type="button" class="slot" data-t="11:30">11:30</button>
      <button type="button" class="slot" data-t="13:00">13:00</button>
      <button type="button" class="slot" data-t="15:00">15:00</button>
      <button type="button" class="slot" data-t="17:00">17:00</button>
      <button type="button" class="slot" data-t="19:00">19:00</button>
    </div>
  </section>

  <section class="card">
    <h2>О вас</h2>
    <label for="name">Имя</label>
    <input type="text" id="name" placeholder="Как к вам обращаться" maxlength="60" autocomplete="name">
    <label for="phone">Телефон</label>
    <input type="tel" id="phone" placeholder="+7" maxlength="20" autocomplete="tel">
    <label for="note">Комментарий</label>
    <textarea id="note" placeholder="Пожелания к записи" maxlength="200"></textarea>
    <button type="button" class="btn" id="submit">Записаться</button>
  </section>

  <a href="#" class="admin-link" id="admin-toggle">мои записи</a>
  <div class="admin" id="admin">
    <div class="card">
      <h2>Записи</h2>
      <div id="book-list"><p style="color:var(--mute);font-size:13px">Пока пусто</p></div>
    </div>
  </div>
  <p class="foot">Ti · брови</p>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="check">✓</div>
    <h3>Вы записаны</h3>
    <p id="ok-text">Мастер получил вашу заявку и свяжется для подтверждения.</p>
    <button type="button" id="ok-close">Отлично</button>
  </div>
</div>


<script>
/* =========================================================
   ЕДИНСТВЕННАЯ НАСТРОЙКА
   Вставь сюда URL из Google Apps Script (Deploy → Web app → /exec)
   ========================================================= */
var TI_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjpoqHgyK83Jv58BS87g_qkupG5dPN0xi4d97rV8oGphlUYeGqZPvlJdMX4iVo9AsSmQ/exec';

var svc = 'Коррекция бровей', price = 1500, time = '', KEY = 'ti_bookings_v1';

if(window.Telegram&&Telegram.WebApp){try{Telegram.WebApp.ready();Telegram.WebApp.expand();try{Telegram.WebApp.setHeaderColor('#efe6e2');Telegram.WebApp.setBackgroundColor('#efe6e2')}catch(e){}}catch(e){}}
function storage(){try{localStorage.setItem('_','1');localStorage.removeItem('_');return localStorage}catch(e){return{d:{},getItem:function(k){return this.d[k]||null},setItem:function(k,v){this.d[k]=String(v)}}}}
var store=storage();
(function(){var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');var el=document.getElementById('date');el.min=d.getFullYear()+'-'+m+'-'+day;el.value=el.min})();
document.getElementById('services').addEventListener('click',function(e){var b=e.target.closest('.svc');if(!b)return;document.querySelectorAll('.svc').forEach(function(x){x.classList.remove('active')});b.classList.add('active');svc=b.getAttribute('data-svc');price=+b.getAttribute('data-price')||0});
document.getElementById('slots').addEventListener('click',function(e){var b=e.target.closest('.slot');if(!b)return;document.querySelectorAll('.slot').forEach(function(x){x.classList.remove('active')});b.classList.add('active');time=b.getAttribute('data-t')});
function loadList(){var list=[];try{list=JSON.parse(store.getItem(KEY)||'[]')}catch(e){}var box=document.getElementById('book-list');if(!list.length){box.innerHTML='<p style="color:var(--mute);font-size:13px">Пока пусто</p>';return}box.innerHTML=list.slice().reverse().map(function(b){return '<div class="book-item"><strong>'+b.name+' · '+b.svc+'</strong><span>'+b.date+' в '+b.time+' · '+b.phone+(b.note?' · '+b.note:'')+'</span></div>'}).join('')}
document.getElementById('submit').onclick=function(){var name=(document.getElementById('name').value||'').trim(),phone=(document.getElementById('phone').value||'').trim(),note=(document.getElementById('note').value||'').trim(),date=document.getElementById('date').value;if(!date){alert('Выберите день');return}if(!time){alert('Выберите время');return}if(!name){alert('Укажите имя');return}if(!phone){alert('Укажите телефон');return}var row={id:Date.now(),svc:svc,price:price,date:date,time:time,name:name,phone:phone,note:note,at:new Date().toISOString()};var list=[];try{list=JSON.parse(store.getItem(KEY)||'[]')}catch(e){}list.push(row);try{store.setItem(KEY,JSON.stringify(list))}catch(e){}document.getElementById('ok-text').textContent=name+', вы записаны на «'+svc+'» · '+date+' в '+time+'. Мастер скоро подтвердит.';document.getElementById('overlay').classList.add('show');loadList();try{if(Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}
  if(TI_SCRIPT_URL){
    var payload={action:'book',name:name,phone:phone,note:note,svc:svc,price:price,date:date,time:time,at:row.at};
    var body=JSON.stringify(payload);
    try{
      fetch(TI_SCRIPT_URL,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:body,
        redirect:'follow'
      }).then(function(r){
        /* GAS may redirect; opaque is ok if server got POST */
      }).catch(function(){
        /* fallback no-cors — request still reaches Apps Script */
        try{
          fetch(TI_SCRIPT_URL,{method:'POST',mode:'no-cors',body:body});
        }catch(e2){}
      });
    }catch(e){
      try{fetch(TI_SCRIPT_URL,{method:'POST',mode:'no-cors',body:body})}catch(e3){}
    }
  }
};
document.getElementById('ok-close').onclick=function(){document.getElementById('overlay').classList.remove('show');document.getElementById('name').value='';document.getElementById('phone').value='';document.getElementById('note').value=''};
document.getElementById('admin-toggle').onclick=function(e){e.preventDefault();document.getElementById('admin').classList.toggle('show');loadList()};
